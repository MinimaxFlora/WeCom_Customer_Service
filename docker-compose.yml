services:
  app:
    image: dockorae/wecom-customer-service:latest
    container_name: wecom-customer-service
    restart: unless-stopped
    ports:
      - "${DOCKER_SERVER_PORT:-8081}:8081"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - ./.env
    depends_on:
      - redis
    networks:
      - wecom-network

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_HOST:-wecom-redis}
    restart: unless-stopped
    command: redis-server --port ${REDIS_PORT:-16379} --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - wecom-network

networks:
  wecom-network:
    driver: bridge

volumes:
  redis_data:
